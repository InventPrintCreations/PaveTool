[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pavetool"
version = "0.1.0"
description = "Utilities for importing call logs into integration-friendly payloads."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[project.scripts]
pavetool-call-log = "pavetool.call_log.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
